<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img"><title>Different cell elevations, continuous hex terrain</title><rect width="960" height="440" fill="#14232b" /><text x="32" y="42" font-family="Helvetica,Arial,sans-serif" font-size="27" fill="#e8e5d9">Different cell elevations, continuous hex terrain</text><text x="32" y="72" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#b5c0be">Absolute corner height = cell elevation + relative corner height</text><polygon points="320.000,201.000 320.000,157.500 419.593,186.250" fill="#47664e" stroke="#63806d" stroke-width=".6" /><polygon points="320.000,201.000 419.593,186.250 419.593,215.750" fill="#47664e" stroke="#63806d" stroke-width=".6" /><polygon points="320.000,201.000 419.593,215.750 320.000,216.500" fill="#47664e" stroke="#63806d" stroke-width=".6" /><polygon points="320.000,201.000 320.000,216.500 220.407,243.750" fill="#47664e" stroke="#63806d" stroke-width=".6" /><polygon points="320.000,201.000 220.407,243.750 220.407,186.250" fill="#47664e" stroke="#63806d" stroke-width=".6" /><polygon points="320.000,201.000 220.407,186.250 320.000,157.500" fill="#47664e" stroke="#63806d" stroke-width=".6" /><polygon points="320.000,157.500 419.593,186.250 419.593,215.750 320.000,216.500 220.407,243.750 220.407,186.250" fill="none" stroke="#c3d1bb" stroke-width="1.5" /><polygon points="419.593,249.917 419.593,215.750 519.186,216.500" fill="#54725a" stroke="#63806d" stroke-width=".6" /><polygon points="419.593,249.917 519.186,216.500 519.186,274.000" fill="#54725a" stroke="#63806d" stroke-width=".6" /><polygon points="419.593,249.917 519.186,274.000 419.593,302.750" fill="#54725a" stroke="#63806d" stroke-width=".6" /><polygon points="419.593,249.917 419.593,302.750 320.000,274.000" fill="#54725a" stroke="#63806d" stroke-width=".6" /><polygon points="419.593,249.917 320.000,274.000 320.000,216.500" fill="#54725a" stroke="#63806d" stroke-width=".6" /><polygon points="419.593,249.917 320.000,216.500 419.593,215.750" fill="#54725a" stroke="#63806d" stroke-width=".6" /><polygon points="419.593,215.750 519.186,216.500 519.186,274.000 419.593,302.750 320.000,274.000 320.000,216.500" fill="none" stroke="#c3d1bb" stroke-width="1.5" /><polyline points="419.593,215.750 320.000,216.500" fill="none" stroke="#edca74" stroke-width="4" /><text x="314.0" y="189.0" font-family="Helvetica,Arial,sans-serif" font-size="22" fill="#e8e5d9">A</text><text x="413.5929214352104" y="249.91666666666666" font-family="Helvetica,Arial,sans-serif" font-size="22" fill="#e8e5d9">B</text><circle cx="419.5929214352104" cy="215.75" r="4" fill="#edca74" /><text x="427.5929214352104" y="206.75" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#e8e5d9">P</text><circle cx="320.0" cy="216.5" r="4" fill="#edca74" /><text x="328.0" y="207.5" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#e8e5d9">Q</text><text x="610" y="160" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#e8e5d9">P: A 0 + 1 = B 1 + 0 = 1</text><text x="610" y="192" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#e8e5d9">Q: A 0 + 2 = B 1 + 1 = 2</text><text x="32" y="335" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#e8e5d9">A: elevation 0 · local corners [0, 0, 1, 2, 0, 0]</text><text x="32" y="367" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#e8e5d9">B: elevation 1 · local corners [0, 1, 1, 1, 1, 1]</text><text x="32" y="410" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#b5c0be">Each cell retains a local zero. No internal plinth is needed where the shared profiles match.</text></svg>