<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img"><title>A waterfall is an edge connection across a drop</title><rect width="960" height="440" fill="#14232b" /><text x="32" y="42" font-family="Helvetica,Arial,sans-serif" font-size="27" fill="#e8e5d9">A waterfall is an edge connection across a drop</text><text x="32" y="72" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#b5c0be">Both terrain cells are hexes. The water crossing occupies only part of their shared edge.</text><polygon points="320.000,159.000 320.000,101.500 419.593,130.250" fill="#47664e" stroke="#63806d" stroke-width=".6" /><polygon points="320.000,159.000 419.593,130.250 419.593,187.750" fill="#47664e" stroke="#63806d" stroke-width=".6" /><polygon points="320.000,159.000 419.593,187.750 320.000,216.500" fill="#47664e" stroke="#63806d" stroke-width=".6" /><polygon points="320.000,159.000 320.000,216.500 220.407,187.750" fill="#47664e" stroke="#63806d" stroke-width=".6" /><polygon points="320.000,159.000 220.407,187.750 220.407,130.250" fill="#47664e" stroke="#63806d" stroke-width=".6" /><polygon points="320.000,159.000 220.407,130.250 320.000,101.500" fill="#47664e" stroke="#63806d" stroke-width=".6" /><polygon points="320.000,101.500 419.593,130.250 419.593,187.750 320.000,216.500 220.407,187.750 220.407,130.250" fill="none" stroke="#c3d1bb" stroke-width="1.5" /><polygon points="419.593,273.250 419.593,215.750 519.186,244.500" fill="#54725a" stroke="#63806d" stroke-width=".6" /><polygon points="419.593,273.250 519.186,244.500 519.186,302.000" fill="#54725a" stroke="#63806d" stroke-width=".6" /><polygon points="419.593,273.250 519.186,302.000 419.593,330.750" fill="#54725a" stroke="#63806d" stroke-width=".6" /><polygon points="419.593,273.250 419.593,330.750 320.000,302.000" fill="#54725a" stroke="#63806d" stroke-width=".6" /><polygon points="419.593,273.250 320.000,302.000 320.000,244.500" fill="#54725a" stroke="#63806d" stroke-width=".6" /><polygon points="419.593,273.250 320.000,244.500 419.593,215.750" fill="#54725a" stroke="#63806d" stroke-width=".6" /><polygon points="419.593,215.750 519.186,244.500 519.186,302.000 419.593,330.750 320.000,302.000 320.000,244.500" fill="none" stroke="#c3d1bb" stroke-width="1.5" /><polygon points="419.593,187.750 320.000,216.500 320.000,244.500 419.593,215.750" fill="#927e60" stroke="#c5ac7d" stroke-width="1" /><polyline points="320.000,101.500 320.000,159.000 369.796,202.125 369.796,230.125 419.593,273.250 519.186,302.000" fill="none" stroke="#78b7c4" stroke-width="13" stroke-linejoin="round" /><line x1="369.7964607176052" y1="202.125" x2="369.7964607176052" y2="230.125" stroke="#d9eeea" stroke-width="7" /><text x="255.0" y="184.0" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#e8e5d9">Upper reach</text><text x="399.5929214352104" y="303.25" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#e8e5d9">Lower reach</text><text x="610" y="147" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#e8e5d9">P: upper 2 → lower 1</text><text x="610" y="179" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#e8e5d9">Q: upper 2 → lower 1</text><text x="610" y="223" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#e8e5d9">Crossing: same position and width</text><text x="610" y="251" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#e8e5d9">Water levels and flow are explicit</text><text x="32" y="346" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#e8e5d9">A height step without a river is exposed terrain. Add the connected upper and lower water reaches</text><text x="32" y="375" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#e8e5d9">and a drop between their water surfaces to create the waterfall.</text><text x="32" y="414" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#b5c0be">Illustrative height unit and channel width; not production renderer geometry.</text></svg>