# Knowledge Islands repository configuration.
# Its presence declares conformance with the Knowledge Islands repository standard.

# -----------------------------------------------------------------------------
# Foundation
# -----------------------------------------------------------------------------

[repo]
harnesses = [
  "knowledgeislands/ki-agent-backpack",
]

[skills.ki-repo]
repo_type = "project"
primary_shape = "ki-repo-project"
repository = "https://github.com/knowledgeislands/packages-tessera"
title = "Tessera"
capital = "https://github.com/knowledgeislands/ki-principal"
description = "Tessera, the Knowledge Islands design system: tokens, glyphs, symbol library, tile sets, hex map engine and web components, each a package consumers vendor and lock on their own."
# Kept from before the rename, so decision-record ids and citations stay valid.
repo_code = "KI-DESIGN"
supported_runtimes = [
  "claude-code",
  "claude-desktop",
  "chatgpt-codex",
]
visibility = "public"
license = "MIT"

[skills.ki-authoring]

# -----------------------------------------------------------------------------
# Repository shape
# -----------------------------------------------------------------------------

[skills.ki-repo-project]

# A package repository: consumers vendor packages/<package>/ under a lock. Tessera
# vendors each layer on its own (ELEMENTS-MULTI), so every packages/tessera*/
# folder is a vendored tree; `package` names the web components, the rest follow
# its tooling and release.
[skills.ki-repo-packages]
package = "tessera"

# -----------------------------------------------------------------------------
# Governance and runtime
# -----------------------------------------------------------------------------

[skills.ki-engineering]

[skills.ki-decision-records]

[skills.ki-guides]

[skills.ki-env-binding]

[skills.ki-env-binding-claude]

[skills.ki-env-binding-chatgpt]

[skills.ki-env-housekeeping]

[skills.ki-env-housekeeping-claude]
auto_memory = "disabled"

[skills.ki-env-housekeeping-chatgpt]
auto_memory = "disabled"

[skills.ki-env-tokenomics]
headroom = "recommended"
preferred_model_type = "standard"
